<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Mod Banner</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        .banner {
            position: relative;
            max-width: 100%;
        }

        .banner img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .update-button {
            position: absolute;
            left: 6%;
            right: 6%;
            bottom: 6%;
            height: 11%;
            border-radius: 999px;
            text-decoration: none;
            color: transparent;
            font-size: 0;
        }
    </style>
</head>
<body>
    <div class="banner">
        <img src="img/banner.png" alt="TikTok Mod Banner">
        <a class="update-button"
           href="https://t.me/adrmodtt"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Обновить сейчас"></a>
    </div>
</body>
</html>

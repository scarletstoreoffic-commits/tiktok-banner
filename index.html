<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTokmods</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #111;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .banner {
            position: relative;
            width: min(100%, 1536px);
        }

        .banner img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Telegram button on the image */
        .telegram-link {
            position: absolute;
            left: 51%;
            right: 5%;
            bottom: 5.5%;
            height: 15%;
            border-radius: 30px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="banner">
        <img src="img/banner.png" alt="TikTokmods">

        <a
            class="telegram-link"
            href="https://t.me/adrmodtt"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Telegram">
        </a>
    </div>
</body>
</html>
